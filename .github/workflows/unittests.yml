on:
  push:
    paths: ['**.R', '**.qml', '**.js', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'renv.lock', 'MAKEVARS', 'MAKEVARS.win', '**.yml']
  pull_request:
    paths: ['**.R', '**.qml', '**.js', 'tests/**', '**.Rd', '**.c', '**.cpp', '**.h', '**.hpp', 'DESCRIPTION', 'NAMESPACE', 'renv.lock', 'MAKEVARS', 'MAKEVARS.win', '**.yml']
  schedule:
    - cron:  '13 12 * * 1-5'

name: unit-tests

jobs:

  qml-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check QML JavaScript behavior
        run: |
          node tests/qml/test-network-presets.js
          node tests/qml/test-network-actions.js
          node tests/qml/test-network-rating.js
          node tests/qml/test-forecasting-actions.js

  unit-tests:

    uses: jasp-stats/jasp-actions/.github/workflows/unittests.yml@master
    with:
      needs_JAGS:   false
      needs_igraph: false

  qml-treatment-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install the tested Qt binding runtime
        run: python -m pip install PySide6==6.8.3
      - name: Check Treatment selector initialization and transitions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
          QML_DISABLE_DISK_CACHE: '1'
        run: python tests/qml/test-treatment-phase-selectors.py
      - name: Check Network slider geometry and interaction with Basic style
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Basic
          QML_DISABLE_DISK_CACHE: '1'
        run: python tests/qml/test-network-rating-layout.py
      - name: Check Network slider geometry and interaction with Fusion style
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_CONTROLS_STYLE: Fusion
          QML_DISABLE_DISK_CACHE: '1'
        run: python tests/qml/test-network-rating-layout.py
